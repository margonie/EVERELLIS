<!doctype html>
<html lang="mn">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>EVERELLIS | Royal Events</title>
    <link rel="stylesheet" href="css/style.css" />
    <style>
      .events-hero {
        text-align: center;
        padding: 65px 15px;
        background: radial-gradient(ellipse, #302416, #080a10 75%);
      }

      .events-hero h1 {
        font-family: Cinzel, serif;
        color: #e4c783;
        font-size: clamp(30px, 5vw, 55px);
        letter-spacing: 5px;
      }

      .events-hero p {
        color: #a99b80;
        letter-spacing: 3px;
        margin-top: 15px;
      }

      .events-container {
        max-width: 1100px;
        margin: auto;
        padding: 40px 20px 90px;
      }

      .events-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 25px;
      }

      .event-card {
        background: #111722;
        border: 1px solid rgba(201, 164, 94, 0.25);
        transition: 0.35s;
        overflow: hidden;
      }

      .event-card:hover {
        transform: translateY(-6px);
        border-color: #c9a45e;
      }

      .event-card img {
        width: 100%;
        height: 240px;
        object-fit: cover;
        display: block;
      }

      .event-card-content {
        padding: 25px;
      }

      .event-category {
        color: #c9a45e;
        font-size: 10px;
        letter-spacing: 3px;
      }

      .event-card h2 {
        color: #eed7a3;
        font-family: Cinzel, serif;
        margin: 15px 0;
      }

      .event-card p {
        color: #9299a7;
        font-size: 12px;
        line-height: 2;
        margin-bottom: 12px;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
      }

      .event-meta {
        color: #c9a45e;
        font-size: 11px;
        margin: 12px 0;
      }

      .event-empty {
        text-align: center;
        padding: 70px 20px;
        border: 1px solid rgba(201, 164, 94, 0.2);
        color: #9299a7;
      }

      @media (max-width: 650px) {
        .events-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>

  <body>
    <header>
      <div class="brand">
        <div class="brand-icon"><span>♛</span></div>
        <div>
          <div class="brand-name">EVERELLIS</div>
          <div class="brand-sub">ROYAL KINGDOM</div>
        </div>
      </div>

      <button class="menu-btn" id="menuBtn">☰</button>

      <nav id="navMenu">
        <a href="index.html">НҮҮР</a>
        <a href="about.html">ХААНТ УЛС</a>
        <a href="map.html">ГАЗРЫН ЗУРАГ</a>
        <a href="laws.html">ХУУЛЬ</a>
        <a href="events.html" class="active">ЭВЕНТ</a>
        <a href="account.html">ИРГЭНИЙ БҮРТГЭЛ</a>
      </nav>
    </header>

    <main>
      <section class="events-hero">
        <p class="eyebrow">THE ROYAL CHRONICLES</p>
        <h1>ROYAL EVENTS</h1>
        <div class="royal-line"></div>
        <p>EVERELLIS KINGDOM OFFICIAL EVENTS</p>
      </section>

      <div class="events-container">
        <div id="publicEventList" class="events-grid"></div>
      </div>
    </main>

    <footer>
      <div>EVERELLIS ROYAL KINGDOM</div>
      <div>ROYAL EVENTS <span>♛</span></div>
    </footer>
    <div class="floating-stars"></div>
    <script>
      const starContainer = document.querySelector(".floating-stars");

      for (let i = 0; i < 45; i++) {
        const star = document.createElement("span");

        star.className = "star";
        star.innerHTML = "✦";

        star.style.left = Math.random() * 100 + "%";
        star.style.animationDuration = 8 + Math.random() * 12 + "s";
        star.style.animationDelay = Math.random() * 15 + "s";
        star.style.fontSize = 6 + Math.random() * 12 + "px";

        starContainer.appendChild(star);
      }
    </script>

    <!-- Supabase сан -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Supabase холболт -->
    <script src="js/supabase.js"></script>

    <!-- Events код -->
    <script src="js/events.js"></script>
    <script>
      document.getElementById("menuBtn").onclick = function () {
        document.getElementById("navMenu").classList.toggle("open");
      };
    </script>
  </body>
</html>
